name: windows-ime

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-ime.yml"
      - "windows/**"
  pull_request:
    paths:
      - ".github/workflows/windows-ime.yml"
      - "windows/**"

permissions:
  contents: read

concurrency:
  group: windows-ime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout KotonohaCollector
        uses: actions/checkout@v7

      - name: Prepare pinned Mozc source
        id: prepare
        shell: pwsh
        run: |
          $buildDirectory = & .\windows\scripts\Prepare-Mozc.ps1 | Select-Object -Last 1
          "build_directory=$buildDirectory" >> $env:GITHUB_OUTPUT

      - name: Restore Mozc dependency cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.prepare.outputs.build_directory }}\src\third_party_cache
          key: mozc-windows-${{ runner.os }}-851c3fe33060d2a6090363e4d7ec44fafde2c03d-v1

      - name: Fetch Mozc dependencies
        shell: pwsh
        working-directory: ${{ steps.prepare.outputs.build_directory }}\src
        run: python build_tools/update_deps.py

      - name: Restore prebuilt Qt cache
        id: qt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.prepare.outputs.build_directory }}\src\third_party\qt
          key: mozc-qt-${{ runner.os }}-${{ runner.arch }}-851c3fe33060d2a6090363e4d7ec44fafde2c03d-6.9.1-release-v1

      - name: Build Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ steps.prepare.outputs.build_directory }}\src
        run: python build_tools/build_qt.py --release --confirm_license

      - name: Verify Qt
        shell: pwsh
        run: |
          $qtDirectory = Join-Path "${{ steps.prepare.outputs.build_directory }}" 'src\third_party\qt'
          $requiredFiles = @(
            (Join-Path $qtDirectory 'bin\moc.exe'),
            (Join-Path $qtDirectory 'bin\Qt6Core.dll'),
            (Join-Path $qtDirectory 'lib\Qt6Core.lib')
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Qt cache/build is incomplete: $requiredFile"
            }
          }

      - name: Save prebuilt Qt cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.prepare.outputs.build_directory }}\src\third_party\qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Configure Bazel caches
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          module-root: ${{ steps.prepare.outputs.build_directory }}\src
          bazelisk-cache: true
          disk-cache: windows-ime-${{ runner.os }}-${{ runner.arch }}-release-v1
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build Windows IME package and run unit tests
        shell: pwsh
        working-directory: ${{ steps.prepare.outputs.build_directory }}\src
        run: >-
          bazelisk test
          //:package
          //kotonoha:event_builder_test
          //renderer:renderer_style_handler_test
          //win32/base:keyevent_handler_test
          --config release_build
          --copt=/DKOTONOHA_COLLECTOR_BUILD
          --copt=/clang:-Wno-nullability-completeness
          --copt=/clang:-Wno-ignored-attributes
          --copt=/clang:-Wno-invalid-offsetof

      - name: Stage MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\windows\dist -Force | Out-Null
          Copy-Item -LiteralPath "${{ steps.prepare.outputs.build_directory }}\src\bazel-bin\win32\installer\Mozc64.msi" -Destination .\windows\dist\KotonohaCollector-Windows-x64.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: KotonohaCollector-Windows-x64
          path: windows/dist/KotonohaCollector-Windows-x64.msi
          if-no-files-found: error
